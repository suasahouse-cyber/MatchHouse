<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Match House Ring</title>
    <meta
      name="description"
      content="Match House signet ring — slow rotation."
    />
    <link rel="icon" href="/match-house-mark.png" type="image/png" />
    <style>
      :root {
        --cream: #ede6d5;
        --ink: #111111;
        --frame-ms: 1100;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--cream);
        color: var(--ink);
        overflow: hidden;
      }

      body {
        font-family: Georgia, "Times New Roman", Times, serif;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        padding: max(16px, env(safe-area-inset-top)) 16px
          max(16px, env(safe-area-inset-bottom));
      }

      .ring {
        position: relative;
        width: min(82vw, 560px);
        aspect-ratio: 1482 / 1061;
        user-select: none;
        -webkit-user-select: none;
      }

      .ring img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        transition: opacity 280ms ease;
        pointer-events: none;
      }

      .ring img.is-active {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        .ring img {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div
        class="ring"
        id="ring"
        role="img"
        aria-label="Match House signet ring slowly rotating"
      ></div>
    </main>
    <script>
      (() => {
        // Turntable order: front → right → side → back → through → left-front
        const FRAMES = [
          "/ring/frames/04.jpg",
          "/ring/frames/05.jpg",
          "/ring/frames/02.jpg",
          "/ring/frames/01.jpg",
          "/ring/frames/06.jpg",
          "/ring/frames/03.jpg",
        ];

        const ring = document.getElementById("ring");
        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;
        const images = FRAMES.map((src, i) => {
          const img = document.createElement("img");
          img.src = src;
          img.alt = "";
          img.decoding = "async";
          if (i === 0) {
            img.loading = "eager";
            img.classList.add("is-active");
          } else {
            img.loading = "eager";
          }
          ring.appendChild(img);
          return img;
        });

        let index = 0;
        let timer = 0;

        function show(next) {
          images[index].classList.remove("is-active");
          index = (next + images.length) % images.length;
          images[index].classList.add("is-active");
        }

        function tick() {
          show(index + 1);
        }

        if (!reduceMotion) {
          const rootStyles = getComputedStyle(document.documentElement);
          const frameMs =
            parseFloat(rootStyles.getPropertyValue("--frame-ms")) || 900;
          timer = window.setInterval(tick, frameMs);
        }

        window.addEventListener("pagehide", () => {
          if (timer) window.clearInterval(timer);
        });
      })();
    </script>
  </body>
</html>
