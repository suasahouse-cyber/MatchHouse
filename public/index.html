<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Matchhouse New York</title>
    <meta
      name="description"
      content="Welcome to Matchhouse New York, a backgammon social club for NYC creatives."
    />
    <link rel="icon" href="match-house-mark.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --yellow: #f4e43a;
        --ink: #1a1a1a;
        --cream: #ede6d5;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--yellow);
        color: var(--ink);
        overflow: hidden;
      }

      body {
        font-family: "Fraunces", Georgia, "Times New Roman", serif;
      }

      #parade {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 0;
      }

      .copy {
        position: relative;
        z-index: 1;
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        pointer-events: none;
      }

      .copy p {
        position: relative;
        max-width: 22ch;
        font-size: clamp(1.35rem, 3.6vw, 2rem);
        font-weight: 550;
        line-height: 1.35;
        letter-spacing: -0.01em;
        text-align: center;
        text-wrap: pretty;
        color: var(--ink);
        text-shadow: 0 1px 0 rgba(244, 228, 58, 0.85),
          0 0 18px rgba(244, 228, 58, 0.9), 0 0 42px rgba(244, 228, 58, 0.75);
      }

      .copy p::before {
        content: "";
        position: absolute;
        inset: -18% -22%;
        z-index: -1;
        background: radial-gradient(
          ellipse at center,
          rgba(244, 228, 58, 0.88) 0%,
          rgba(244, 228, 58, 0.55) 42%,
          rgba(244, 228, 58, 0) 72%
        );
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="parade" aria-hidden="true"></canvas>
    <main class="copy">
      <p>
        Welcome to Matchhouse New York, a backgammon social club for NYC
        creatives. Our next gathering is October 24, 2026. Our RSVPs will be
        opening soon.
      </p>
    </main>

    <script>
      (() => {
        const canvas = document.getElementById("parade");
        const ctx = canvas.getContext("2d");
        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        const BG = "#f4e43a";
        const COLORS = [
          "#7d6cff",
          "#57c84d",
          "#ff8a2a",
          "#4aa8ff",
          "#ff5cad",
          "#9b6bff",
          "#38c76a",
          "#ff6b4a",
        ];

        const POINT_COUNT = 56;
        const HOLD = 1.35;
        const MORPH = 1.05;
        const CYCLE = (HOLD + MORPH) * 3;

        let dpr = 1;
        let cols = 0;
        let rows = 0;
        let spacing = 0;
        let radius = 0;
        let items = [];
        let start = performance.now();

        function heartPoint(t, r) {
          // Parametric heart, normalized into roughly unit circle scale
          const x = 16 * Math.pow(Math.sin(t), 3);
          const y =
            -(
              13 * Math.cos(t) -
              5 * Math.cos(2 * t) -
              2 * Math.cos(3 * t) -
              Math.cos(4 * t)
            );
          return { x: (x / 17) * r, y: (y / 17) * r * 0.95 };
        }

        function circlePoint(t, r) {
          return { x: Math.cos(t) * r, y: Math.sin(t) * r };
        }

        function starPoint(t, r) {
          // 5-point star with soft tips via radius modulation
          const spikes = 5;
          const ang = t - Math.PI / 2;
          const sector = (Math.PI * 2) / spikes;
          const local = ((ang % sector) + sector) % sector;
          const edge = Math.min(local, sector - local) / (sector / 2);
          const outer = r;
          const inner = r * 0.42;
          const rad = inner + (outer - inner) * Math.pow(1 - edge, 1.35);
          return { x: Math.cos(ang) * rad, y: Math.sin(ang) * rad };
        }

        function shapePoint(kind, i, r) {
          const t = (i / POINT_COUNT) * Math.PI * 2;
          if (kind === 0) return heartPoint(t, r);
          if (kind === 1) return circlePoint(t, r);
          return starPoint(t, r);
        }

        function easeInOut(t) {
          return t * t * (3 - 2 * t);
        }

        function morphProgress(elapsed) {
          const t = ((elapsed / 1000) % CYCLE + CYCLE) % CYCLE;
          const stageLen = HOLD + MORPH;
          const stage = Math.floor(t / stageLen) % 3;
          const local = t - stage * stageLen;
          if (local <= HOLD) {
            return { from: stage, to: stage, amt: 0 };
          }
          const amt = easeInOut((local - HOLD) / MORPH);
          return { from: stage, to: (stage + 1) % 3, amt };
        }

        function layout() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          const w = window.innerWidth;
          const h = window.innerHeight;
          canvas.width = Math.floor(w * dpr);
          canvas.height = Math.floor(h * dpr);
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          spacing = Math.max(52, Math.min(78, w < 700 ? 56 : 68));
          radius = spacing * 0.34;
          cols = Math.ceil(w / spacing) + 2;
          rows = Math.ceil(h / (spacing * 0.86)) + 2;

          items = [];
          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              const offset = row % 2 === 0 ? 0 : spacing * 0.5;
              items.push({
                x: col * spacing + offset - spacing * 0.5,
                y: row * spacing * 0.86 - spacing * 0.2,
                color: COLORS[(row * 3 + col * 2) % COLORS.length],
                phase: (row * 0.07 + col * 0.045) % 1,
              });
            }
          }
        }

        function shadeColor(hex, amount) {
          const n = parseInt(hex.slice(1), 16);
          let r = (n >> 16) & 255;
          let g = (n >> 8) & 255;
          let b = n & 255;
          r = Math.max(0, Math.min(255, Math.round(r + amount)));
          g = Math.max(0, Math.min(255, Math.round(g + amount)));
          b = Math.max(0, Math.min(255, Math.round(b + amount)));
          return `rgb(${r},${g},${b})`;
        }

        function drawShape(item, from, to, amt, now) {
          const breath = reduceMotion
            ? 1
            : 1 + Math.sin(now * 0.002 + item.phase * Math.PI * 2) * 0.03;
          const squash =
            amt > 0 && amt < 1
              ? 1 - Math.sin(amt * Math.PI) * 0.18
              : 1;
          const r = radius * breath;

          // Soft contact shadow
          ctx.save();
          ctx.translate(item.x + r * 0.08, item.y + r * 0.22);
          ctx.scale(1.05, 0.55);
          const shadow = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
          shadow.addColorStop(0, "rgba(0,0,0,0.28)");
          shadow.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = shadow;
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.save();
          ctx.translate(item.x, item.y);
          ctx.scale(squash, 1 / Math.max(0.82, squash));

          // Body
          ctx.beginPath();
          for (let i = 0; i <= POINT_COUNT; i++) {
            const a = shapePoint(from, i % POINT_COUNT, r);
            const b = shapePoint(to, i % POINT_COUNT, r);
            const x = a.x + (b.x - a.x) * amt;
            const y = a.y + (b.y - a.y) * amt;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();

          const body = ctx.createLinearGradient(-r, -r, r, r);
          body.addColorStop(0, shadeColor(item.color, 42));
          body.addColorStop(0.45, item.color);
          body.addColorStop(1, shadeColor(item.color, -48));
          ctx.fillStyle = body;
          ctx.fill();

          // Inner shade crescent
          ctx.save();
          ctx.clip();
          const shade = ctx.createRadialGradient(
            r * 0.35,
            r * 0.4,
            r * 0.1,
            0,
            0,
            r * 1.15
          );
          shade.addColorStop(0, "rgba(0,0,0,0)");
          shade.addColorStop(0.55, "rgba(0,0,0,0)");
          shade.addColorStop(1, "rgba(0,0,0,0.28)");
          ctx.fillStyle = shade;
          ctx.fillRect(-r * 1.4, -r * 1.4, r * 2.8, r * 2.8);

          // Gloss highlight
          const gloss = ctx.createRadialGradient(
            -r * 0.35,
            -r * 0.4,
            0,
            -r * 0.2,
            -r * 0.28,
            r * 0.55
          );
          gloss.addColorStop(0, "rgba(255,255,255,0.95)");
          gloss.addColorStop(0.35, "rgba(255,255,255,0.45)");
          gloss.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = gloss;
          ctx.beginPath();
          ctx.ellipse(
            -r * 0.28,
            -r * 0.32,
            r * 0.28,
            r * 0.2,
            -0.4,
            0,
            Math.PI * 2
          );
          ctx.fill();
          ctx.restore();

          ctx.restore();
        }

        function frame(now) {
          const w = window.innerWidth;
          const h = window.innerHeight;
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = BG;
          ctx.fillRect(0, 0, w, h);

          const elapsed = reduceMotion ? HOLD * 1000 : now - start;
          for (const item of items) {
            // Mild wave so the parade feels alive without chaos
            const localElapsed = elapsed + item.phase * MORPH * 1000 * 0.85;
            const { from, to, amt } = morphProgress(localElapsed);
            drawShape(item, from, to, amt, now);
          }

          if (!reduceMotion) requestAnimationFrame(frame);
        }

        layout();
        start = performance.now();
        requestAnimationFrame(frame);

        let resizeTimer = 0;
        window.addEventListener("resize", () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            layout();
            if (reduceMotion) requestAnimationFrame(frame);
          }, 80);
        });
      })();
    </script>
  </body>
</html>
