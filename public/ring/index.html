<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Match House Ring</title>
    <meta
      name="description"
      content="Match House signet ring — drag to rotate."
    />
    <link rel="icon" href="../match-house-mark.png" type="image/png" />
    <style>
      :root {
        --cream: #ede6d5;
        --ink: #1a1a1a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--cream);
        color: var(--ink);
        overflow: hidden;
        touch-action: none;
      }

      .stage {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        padding: max(20px, env(safe-area-inset-top)) 20px
          max(36px, env(safe-area-inset-bottom));
      }

      .float {
        animation: floatY 5.5s ease-in-out infinite;
        will-change: transform;
      }

      @keyframes floatY {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .float {
          animation: none;
        }
      }

      .viewer {
        position: relative;
        width: min(78vw, 420px);
        aspect-ratio: 1;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        /* Soft presence under the ring — not a card */
        filter: drop-shadow(0 18px 28px rgba(40, 28, 16, 0.18));
      }

      .viewer.is-dragging {
        cursor: grabbing;
      }

      .viewer canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      .hint {
        position: fixed;
        left: 50%;
        bottom: max(18px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 2;
        pointer-events: none;
        font-family: Georgia, "Times New Roman", Times, serif;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(26, 26, 26, 0.42);
        transition: opacity 0.7s ease;
      }

      .hint.is-hidden {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="float">
        <div
          class="viewer"
          id="viewer"
          role="img"
          aria-label="Match House signet ring. Drag to rotate."
        >
          <canvas id="canvas" width="512" height="512"></canvas>
        </div>
      </div>
    </main>
    <div class="hint" id="hint">Drag to rotate</div>
    <script>
      (() => {
        const FRAME_COUNT = 24;
        // Absolute paths so /ring (no trailing slash) still loads frames
        const FRAME_SRCS = Array.from(
          { length: FRAME_COUNT },
          (_, i) => `/ring/frames/${String(i + 1).padStart(2, "0")}.webp`
        );

        const viewer = document.getElementById("viewer");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d", { alpha: true });
        const hint = document.getElementById("hint");
        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        /** @type {(HTMLImageElement|null)[]} */
        const frames = new Array(FRAME_COUNT).fill(null);
        let loaded = 0;

        // Continuous angle in frame-space: 0 .. FRAME_COUNT
        let angle = 0;
        let displayAngle = 0;
        let vel = 0;
        let dragging = false;
        let lastX = 0;
        let needsPaint = true;

        function resizeCanvas() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const css = viewer.clientWidth;
          canvas.width = Math.round(css * dpr);
          canvas.height = Math.round(css * dpr);
          needsPaint = true;
        }

        function loadFrames() {
          return Promise.all(
            FRAME_SRCS.map(
              (src, i) =>
                new Promise((resolve, reject) => {
                  const img = new Image();
                  img.decoding = "async";
                  img.onload = () => {
                    frames[i] = img;
                    loaded += 1;
                    resolve();
                  };
                  img.onerror = reject;
                  img.src = src;
                })
            )
          );
        }

        function wrap(a) {
          const n = FRAME_COUNT;
          return ((a % n) + n) % n;
        }

        function paint() {
          if (loaded < FRAME_COUNT) return;
          const w = canvas.width;
          const h = canvas.height;
          ctx.clearRect(0, 0, w, h);

          // Sub-frame blend: fade between neighboring frames for smoothness
          const a = wrap(displayAngle);
          const i0 = Math.floor(a) % FRAME_COUNT;
          const i1 = (i0 + 1) % FRAME_COUNT;
          const t = a - Math.floor(a);

          const img0 = frames[i0];
          const img1 = frames[i1];
          if (!img0 || !img1) return;

          // Contain-fit
          const draw = (img, alpha) => {
            const scale = Math.min(w / img.naturalWidth, h / img.naturalHeight);
            const dw = img.naturalWidth * scale;
            const dh = img.naturalHeight * scale;
            const x = (w - dw) / 2;
            const y = (h - dh) / 2;
            ctx.globalAlpha = alpha;
            ctx.drawImage(img, x, y, dw, dh);
          };

          // Draw base fully, then blend next on top — keeps metal solid, no flash
          if (t < 0.001) {
            draw(img0, 1);
          } else if (t > 0.999) {
            draw(img1, 1);
          } else {
            draw(img0, 1);
            draw(img1, t);
          }
          ctx.globalAlpha = 1;
          needsPaint = false;
        }

        function onDown(e) {
          dragging = true;
          lastX = e.clientX;
          vel = 0;
          viewer.classList.add("is-dragging");
          hint.classList.add("is-hidden");
          try {
            viewer.setPointerCapture?.(e.pointerId);
          } catch (_) {}
          e.preventDefault();
        }

        function onMove(e) {
          if (!dragging) return;
          const dx = e.clientX - lastX;
          lastX = e.clientX;
          // ~1.6 full turns across the viewer width — slow, readable
          const delta = (dx / Math.max(1, viewer.clientWidth)) * FRAME_COUNT * 0.65;
          angle = wrap(angle + delta);
          // Direct follow while dragging for tactile control
          displayAngle = angle;
          vel = delta * 0.85;
          needsPaint = true;
        }

        function onUp(e) {
          dragging = false;
          viewer.classList.remove("is-dragging");
          try {
            viewer.releasePointerCapture?.(e.pointerId);
          } catch (_) {}
        }

        viewer.addEventListener("pointerdown", onDown);
        window.addEventListener("pointermove", onMove, { passive: false });
        window.addEventListener("pointerup", onUp);
        window.addEventListener("pointercancel", onUp);
        viewer.addEventListener("mousedown", onDown);
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);

        viewer.addEventListener(
          "wheel",
          (e) => {
            const dx =
              Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
            angle = wrap(angle + dx / 60);
            displayAngle = angle;
            hint.classList.add("is-hidden");
            needsPaint = true;
            e.preventDefault();
          },
          { passive: false }
        );

        window.addEventListener("resize", () => {
          resizeCanvas();
        });

        function tick() {
          if (!dragging && !reduceMotion) {
            // Smooth inertia + ease display toward angle
            if (Math.abs(vel) > 0.0008) {
              angle = wrap(angle + vel);
              vel *= 0.94;
            } else {
              vel = 0;
            }
          }

          // Ease displayAngle toward angle for butter-smooth settling
          let diff = angle - displayAngle;
          // shortest path on the loop
          if (diff > FRAME_COUNT / 2) diff -= FRAME_COUNT;
          if (diff < -FRAME_COUNT / 2) diff += FRAME_COUNT;
          if (dragging) {
            displayAngle = angle;
          } else if (Math.abs(diff) > 0.0005) {
            displayAngle = wrap(displayAngle + diff * 0.22);
            needsPaint = true;
          }

          if (needsPaint || dragging || Math.abs(vel) > 0.0008) {
            needsPaint = true;
            paint();
          }
          requestAnimationFrame(tick);
        }

        resizeCanvas();
        loadFrames()
          .then(() => {
            needsPaint = true;
            paint();
            requestAnimationFrame(tick);
          })
          .catch((err) => console.error(err));
      })();
    </script>
  </body>
</html>
