<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Match House Ring</title>
    <meta
      name="description"
      content="Match House signet ring — drag to rotate."
    />
    <link rel="icon" href="/match-house-mark.png" type="image/png" />
    <style>
      :root {
        --cream: #ede6d5;
        --ink: #1a1a1a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--cream);
        color: var(--ink);
        overflow: hidden;
        touch-action: none;
      }

      .stage {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        padding: max(16px, env(safe-area-inset-top)) 16px
          max(28px, env(safe-area-inset-bottom));
      }

      .viewer {
        position: relative;
        width: min(86vw, 640px);
        aspect-ratio: 1000 / 716;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      .viewer.is-dragging {
        cursor: grabbing;
      }

      .viewer canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--cream);
      }

      .hint {
        position: fixed;
        left: 50%;
        bottom: max(18px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 2;
        pointer-events: none;
        font-family: Georgia, "Times New Roman", Times, serif;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(26, 26, 26, 0.45);
        transition: opacity 0.7s ease;
      }

      .hint.is-hidden {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div
        class="viewer"
        id="viewer"
        role="img"
        aria-label="Match House signet ring. Drag to rotate."
      >
        <canvas id="canvas" width="1000" height="716"></canvas>
      </div>
    </main>
    <div class="hint" id="hint">Drag to rotate</div>
    <script>
      (() => {
        // Turntable order around the ring (one continuous object)
        const FRAME_SRCS = [
          "/ring/frames/04.jpg", // front
          "/ring/frames/05.jpg", // front-right
          "/ring/frames/02.jpg", // side
          "/ring/frames/01.jpg", // back
          "/ring/frames/06.jpg", // back/through
          "/ring/frames/03.jpg", // front-left
        ];

        const viewer = document.getElementById("viewer");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const hint = document.getElementById("hint");
        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        /** @type {HTMLImageElement[]} */
        const frames = [];
        let ready = 0;
        let angle = 0; // 0..1 around the turntable
        let vel = 0;
        let dragging = false;
        let lastX = 0;
        let lastTs = 0;
        let drawnIndex = -1;

        function loadFrames() {
          return Promise.all(
            FRAME_SRCS.map(
              (src, i) =>
                new Promise((resolve, reject) => {
                  const img = new Image();
                  img.decoding = "async";
                  img.onload = () => {
                    frames[i] = img;
                    ready += 1;
                    resolve(img);
                  };
                  img.onerror = reject;
                  img.src = src;
                })
            )
          );
        }

        function frameIndex() {
          const n = frames.length;
          const a = ((angle % 1) + 1) % 1;
          return Math.min(n - 1, Math.floor(a * n));
        }

        function paint() {
          if (!frames.length || ready < frames.length) return;
          const i = frameIndex();
          // Draw only the active frame into one canvas — no stacked fades/flashes
          if (i === drawnIndex) return;
          drawnIndex = i;
          const img = frames[i];
          const cw = canvas.width;
          const ch = canvas.height;
          ctx.fillStyle = "#ede6d5";
          ctx.fillRect(0, 0, cw, ch);
          // Contain-fit the photo in the cream canvas
          const scale = Math.min(cw / img.naturalWidth, ch / img.naturalHeight);
          const w = img.naturalWidth * scale;
          const h = img.naturalHeight * scale;
          ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
        }

        function forcePaint() {
          drawnIndex = -1;
          paint();
        }

        function onPointerDown(e) {
          dragging = true;
          lastX = e.clientX;
          lastTs = performance.now();
          vel = 0;
          viewer.classList.add("is-dragging");
          hint.classList.add("is-hidden");
          viewer.setPointerCapture?.(e.pointerId);
          e.preventDefault();
        }

        function onPointerMove(e) {
          if (!dragging) return;
          const now = performance.now();
          const dx = e.clientX - lastX;
          const dt = Math.max(8, now - lastTs);
          lastX = e.clientX;
          lastTs = now;
          // One full turn ≈ ~2.2 viewer widths — slow but clearly responsive
          const delta = dx / (viewer.clientWidth * 2.2);
          angle += delta;
          vel = (dx / viewer.clientWidth) * 0.08;
          forcePaint();
        }

        function onPointerUp(e) {
          dragging = false;
          viewer.classList.remove("is-dragging");
          try {
            viewer.releasePointerCapture?.(e.pointerId);
          } catch (_) {}
        }

        function bind(target, type, fn, opts) {
          target.addEventListener(type, fn, opts);
        }

        // Pointer + mouse fallbacks (some automation only sends mouse events)
        bind(viewer, "pointerdown", onPointerDown);
        bind(window, "pointermove", onPointerMove, { passive: false });
        bind(window, "pointerup", onPointerUp);
        bind(window, "pointercancel", onPointerUp);
        bind(viewer, "mousedown", onPointerDown);
        bind(window, "mousemove", onPointerMove);
        bind(window, "mouseup", onPointerUp);

        // Also allow wheel / trackpad horizontal as a rotate affordance
        viewer.addEventListener(
          "wheel",
          (e) => {
            const dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
            angle += dx / 900;
            hint.classList.add("is-hidden");
            forcePaint();
            e.preventDefault();
          },
          { passive: false }
        );

        function tick() {
          if (!dragging && !reduceMotion && Math.abs(vel) > 0.00015) {
            angle += vel * 0.016;
            vel *= 0.9;
            forcePaint();
          } else if (!dragging) {
            vel = 0;
          }
          requestAnimationFrame(tick);
        }

        loadFrames()
          .then(() => {
            forcePaint();
            requestAnimationFrame(tick);
          })
          .catch((err) => {
            console.error(err);
          });
      })();
    </script>
  </body>
</html>
