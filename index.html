<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Match House</title>
    <meta name="description" content="Match House" />
    <link rel="icon" href="public/match-house-mark.png" type="image/png" />
    <style>
      :root {
        --bg: #692522;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        min-height: 100dvh;
        background: var(--bg);
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .mark {
        width: min(72vw, 520px);
        height: auto;
        display: block;
        animation: mark-in 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes mark-in {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <img
      class="mark"
      src="public/match-house-mark.png"
      alt="Match House"
      width="1790"
      height="1716"
    />
  </body>
</html>
